[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dryv-language-dart"
version = "0.1.0a1"
description = "Dart target validation and URI-path adapter for Dryv"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Alidantech" }]
dependencies = ["dryv>=2.0.0a1,<2.1"]
classifiers = ["Programming Language :: Python :: 3", "Typing :: Typed"]

[project.entry-points."dryv.language_adapters"]
dart = "dryv_language_dart.plugin:create_plugin"

[project.urls]
Homepage = "https://github.com/alidantech-org/codepot"
Documentation = "https://github.com/alidantech-org/codepot/tree/develop/.docs/products/dryv/language-dart"
Repository = "https://github.com/alidantech-org/codepot"
Issues = "https://github.com/alidantech-org/codepot/issues"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dryv_language_dart*"]

[tool.setuptools.package-data]
dryv_language_dart = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
markers = ["oracle: optional compiler oracle", "performance: deterministic performance smoke test"]
