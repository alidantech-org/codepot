apiVersion: dryv.dev/v1

name: local-pack-development

sources:
  contract:
    adapter: ir
    file: ./contract.dryv.yaml

executables:
  packageManager: pnpm

security:
  packCommands: approve

packs:
  backendRepositories:
    source:
      local: ./packs/typeorm-repositories
    input: contract
    output: apps/backend

    options:
      repositoryStyle: class

    bindings:
      baseRepository:
        from: src/database/base.repository.ts
        symbol: BaseRepository
