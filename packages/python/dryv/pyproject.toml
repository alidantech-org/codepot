[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dryv"
version = "2.0.0a1"
description = "Typed semantic generation runtime for Dryv"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Alidantech" },
]
keywords = ["codegen", "codepot", "templates", "semantic-ir", "runtime"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "packaging>=24,<26",
  "pathspec>=0.12,<1.0",
  "PyYAML>=6.0.2,<7.0",
]

[project.entry-points."dryv.source_adapters"]
ir = "dryv.infrastructure.ir_source:create_plugin"

[project.urls]
Homepage = "https://github.com/alidantech-org/codepot"
Documentation = "https://github.com/alidantech-org/codepot/tree/develop/.docs/products/dryv/runtime"
Repository = "https://github.com/alidantech-org/codepot"
Issues = "https://github.com/alidantech-org/codepot/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dryv*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
dryv = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
