apiVersion: dryv.dev/v1
id: alidantech/manual-dart-sdk
version: 1.0.0
description: Human-validation Dart pack for the connected Dryv runtime.

requires:
  dryv: ">=2.0.0a1,<2.1"
  ir: ">=2.0,<3.0"

include:
  - "**/*"
exclude:
  - "**/*.draft"

options:
  banner:
    default: Generated by Dryv

bindings:
  contractSource:
    required: true
    description: Human-readable source label included in generated comments.

selections:
  models:
    paths: [lib, models]
    select: groups.schemas.objects.each
    bindings: [contractSource]
    symbols:
      - (schema.name.pascal.s)

  enums:
    paths: [lib, enums]
    select: groups.schemas.enums.each
    bindings: [contractSource]
    symbols:
      - (schema.name.pascal.s)

  library:
    paths: [lib]
    exports: [models, enums]
