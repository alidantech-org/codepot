[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dryv-cli"
version = "0.2.0a1"
description = "Reference Project Client and local orchestrator for Dryv"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Alidantech" }]
keywords = ["codegen", "codepot", "dryv", "cli", "project-client"]
dependencies = [
  "dryv-api>=0.1.0a1,<0.2",
  "PyYAML>=6.0,<7",
]

[project.scripts]
dryv = "dryv_cli.__main__:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dryv_cli*"]

[tool.setuptools.package-data]
dryv_cli = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
