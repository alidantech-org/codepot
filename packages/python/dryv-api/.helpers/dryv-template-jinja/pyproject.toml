[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dryv-template-jinja"
version = "0.2.0a1"
description = "Jinja Render Client for the renderer-neutral Dryv API protocol"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Alidantech" }]
keywords = ["dryv", "jinja", "templates", "codegen"]
dependencies = [
  "dryv-api>=0.1.0a1,<0.2",
  "Jinja2>=3.1,<4",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dryv_template_jinja*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
dryv_template_jinja = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
