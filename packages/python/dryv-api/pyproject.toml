[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dryv-api"
version = "0.1.0a1"
description = "Transport host and wire contracts for Dryv Runtime"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Alidantech" }]
dependencies = [
  "dryv>=2.0.0a1,<2.1",
  "starlette>=0.47,<1",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dryv_api*"]

[tool.setuptools.package-data]
dryv_api = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
