[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codepotg"
version = "1.0.0"
description = "Stable OpenAPI-driven Python and Jinja code generator for Codepot"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Alidantech" },
]
keywords = [
  "openapi",
  "codegen",
  "generator",
  "jinja",
  "typescript",
  "dart",
  "nextjs",
  "codepot",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "typer>=0.12.5",
  "rich>=13.9.0",
  "questionary>=2.0.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "PyYAML>=6.0.2",
  "jinja2>=3.1.4",
  "pluralizer>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.3",
  "ruff>=0.9",
  "twine>=6.0",
]

[project.urls]
Homepage = "https://github.com/alidantech-org/codepot"
Documentation = "https://github.com/alidantech-org/codepot/tree/main/packages/python/codepotg"
Repository = "https://github.com/alidantech-org/codepot"
Issues = "https://github.com/alidantech-org/codepot/issues"
Changelog = "https://github.com/alidantech-org/codepot/releases"

[project.scripts]
codepotg = "codepotg.cli.main:app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "src"
cli = "cli"

[tool.setuptools.packages.find]
where = ["src", "."]
include = [
  "app*",
  "cli*",
  "constants*",
  "codepot_file*",
  "codepotg*",
  "contracts*",
  "core*",
  "emission*",
  "inference*",
  "languages*",
  "openapi*",
  "runtime*",
  "utils*",
]
exclude = ["tests*"]

[tool.setuptools.package-data]
codepotg = [
  "templates/**/*.j2",
  "templates/**/*.yaml",
  "templates/**/*.json",
  "templates/**/*.md",
  "templates/**/.gitignore",
  "templates/**/.prettierrc",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
