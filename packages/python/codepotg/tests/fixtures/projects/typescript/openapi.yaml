openapi: 3.1.0
info:
  title: CodepotG Fixture API
  description: Real project fixture for CodepotG template-pack integration tests.
  version: 1.0.0
servers:
  - url: https://fixture.example.test
x-fixture:
  owner: codepotg
  enabled: true
  values: [first, second]
  explicitNull: null
paths:
  /users:
    x-codegen:
      resource:
        name: users
        path: [fixtures]
    get:
      operationId: listUsers
      summary: List users
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserModel"
    post:
      operationId: createUser
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserBody"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserModel"
components:
  schemas:
    UserStatus:
      type: string
      enum: [active, suspended]
      x-codegen:
        kind: enum
        resource:
          name: users
          path: [fixtures]
    UserModel:
      type: object
      x-codegen:
        kind: model
        resource:
          name: users
          path: [fixtures]
      required: [id, name, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 2
          maxLength: 80
          pattern: "^[A-Za-z ]+$"
        status:
          $ref: "#/components/schemas/UserStatus"
        age:
          type: integer
          minimum: 18
          maximum: 120
          default: 18
    CreateUserBody:
      type: object
      x-codegen:
        kind: dto
        resource:
          name: users
          path: [fixtures]
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
        status:
          $ref: "#/components/schemas/UserStatus"
