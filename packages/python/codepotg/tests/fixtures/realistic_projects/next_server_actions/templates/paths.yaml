template_extension: '.j2'
strip_template_extension: true
allow_raw_files: true

imports:
  strategy: relative

write_policy:
  default_mode: managed
  managed_roots:
    - _gen
  protected_roots:
    - _gen
  clean_roots:
    - _gen

folders:
  root:
    mode: once
    parts:
      - _gen

  server_root:
    mode: once
    parts:
      - _gen
      - server

  actions:
    select: resources
    as: resource
    parts:
      - _gen
      - server
      - actions

  resource_types:
    select: resources
    as: resource
    parts:
      - _gen
      - server
      - types
      - [resource.path]
      - [resource.name.kebab.o]

  resource_dto:
    select: resources
    as: resource
    parts:
      - _gen
      - server
      - types
      - [resource.path]
      - [resource.name.kebab.o]
      - dto

  resource_enums:
    select: resources
    as: resource
    parts:
      - _gen
      - server
      - types
      - [resource.path]
      - [resource.name.kebab.o]
      - enums

  dto:
    select: schemas.emit_dtos
    as: dto
    parts:
      - _gen
      - server
      - types
      - [dto.emit.resource_path]
      - dto

  enum:
    select: schemas.emit_enums
    as: enum
    parts:
      - _gen
      - server
      - types
      - [enum.emit.resource_path]
      - enums
