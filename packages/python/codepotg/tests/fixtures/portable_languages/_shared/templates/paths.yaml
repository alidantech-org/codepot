template_extension: ".j2"
strip_template_extension: true
allow_raw_files: false

write_policy:
  default_mode: managed
  managed_roots:
    - contract
    - schemas
    - operations
    - resources
    - package
    - native
  protected_roots:
    - contract
    - schemas
    - operations
    - resources
    - package
    - native
  clean_roots:
    - contract
    - schemas
    - operations
    - resources
    - package
    - native

folders:
  root:
    mode: once
    parts:
      - contract

  package:
    mode: once
    parts:
      - package

  schema:
    select: schemas.all
    as: schema
    parts:
      - schemas

  native_schema:
    select: schemas.emit_models
    as: schema
    parts:
      - native
      - schemas

  native_enum:
    select: schemas.emit_enums
    as: schema
    parts:
      - native
      - schemas

  operation:
    select: operations
    as: operation
    parts:
      - operations

  native_operation:
    select: operations
    as: operation
    parts:
      - native
      - operations

  resource:
    select: resources
    as: resource
    parts:
      - resources
