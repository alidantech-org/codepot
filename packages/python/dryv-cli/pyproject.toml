[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dryv-cli"
version = "0.1.0a1"
description = "Rich terminal frontend for the Dryv runtime"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Alidantech" }]
keywords = ["codegen", "codepot", "dryv", "cli", "tui"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Code Generators",
  "Typing :: Typed",
]
dependencies = [
  "click>=8.1.7,<9",
  "dryv>=2.0.0a1,<2.1",
  "questionary>=2.1,<3",
  "rich>=13.9,<15",
]

[project.scripts]
dryv = "dryv_cli.main:main"

[project.urls]
Homepage = "https://github.com/alidantech-org/codepot"
Documentation = "https://github.com/alidantech-org/codepot/tree/develop/.docs/products/dryv/cli"
Repository = "https://github.com/alidantech-org/codepot"
Issues = "https://github.com/alidantech-org/codepot/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dryv_cli*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
dryv_cli = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
