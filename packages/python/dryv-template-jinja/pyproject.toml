[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dryv-template-jinja"
version = "2.0.0a1"
description = "Independent Jinja Render Client for the Dryv Render Session protocol"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Alidantech" }]
dependencies = ["Jinja2>=3.1.4,<4.0"]

[project.urls]
Homepage = "https://github.com/alidantech-org/codepot"
Repository = "https://github.com/alidantech-org/codepot"
Issues = "https://github.com/alidantech-org/codepot/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dryv_template_jinja*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
dryv_template_jinja = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
