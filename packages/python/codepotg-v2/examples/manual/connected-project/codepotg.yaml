apiVersion: codepotg.dev/v2
name: manual-connected-project

sources:
  contract:
    adapter: ir
    file: contract.codepot.json

packs:
  typescriptSdk:
    source:
      local: packs/typescript-sdk
    input: contract
    output: generated/typescript
    options:
      banner: Generated by the CodepotG human validation workspace
    bindings:
      contractSource: canonical-ir-json

  dartSdk:
    source:
      local: packs/dart-sdk
    input: contract
    output: generated/dart
    options:
      banner: Generated by the CodepotG human validation workspace
    bindings:
      contractSource: canonical-ir-json
