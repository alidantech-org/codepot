apiVersion: codepotg.dev/v2
name: manual-connected-direct-ir

sources:
  contract:
    adapter: ir
    file: contract.codepot.json

packs:
  typescriptSdk:
    source:
      local: packs/typescript-sdk
    input: contract
    output: typescript
    options:
      banner: Generated from direct public Codepot IR
    bindings:
      contractSource: core-ir-json

  dartSdk:
    source:
      local: packs/dart-sdk
    input: contract
    output: dart
    options:
      banner: Generated from direct public Codepot IR
    bindings:
      contractSource: core-ir-json
