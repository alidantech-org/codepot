apiVersion: dryv.dev/v1

id: alidantech/flutter-sdk
version: 1.4.2
description: Generates a Dart and Flutter API client from groups, schemas, and operations.

requires:
  dryv: ">=2.0 <3.0"
  ir: ">=2.0 <3.0"

options:
  clientName:
    default: ApiClient

selections:
  enums:
    paths: [lib, src, types, enums]
    select: groups.schemas.enums.each
    symbols:
      - (schema.name.pascal.s)

  schemaTypes:
    paths: [lib, src, types, schemas]
    select: groups.schemas.objects.each
    imports:
      enums: enums
    symbols:
      - (schema.name.pascal.s)

  typesIndex:
    paths: [lib, src, types]
    exports: [enums, schemaTypes]

  groupClients:
    paths: [lib, src, clients]
    select: groups.each
    imports:
      types: typesIndex
    symbols:
      - (group.name.pascal.s)Client

  clientsIndex:
    paths: [lib, src, clients]
    exports: [groupClients]

  client:
    paths: [lib, src]
    imports:
      clients: clientsIndex
    symbols:
      - (option.clientName)

  packageIndex:
    paths: [lib]
    exports: [typesIndex, clientsIndex, client]

executables:
  flutter: flutter
  dart: dart

commands:
  after:
    installRuntime:
      executable: flutter
      arguments: [pub, add, "dio:^5.0.0", "json_annotation:^4.0.0"]

    installDevelopment:
      executable: flutter
      arguments: [pub, add, --dev, "build_runner:^2.0.0", "json_serializable:^6.0.0"]

    generateSerialization:
      executable: flutter
      arguments: [pub, run, build_runner, build, --delete-conflicting-outputs]

    format:
      executable: dart
      arguments: [format, lib]
      optional: true
